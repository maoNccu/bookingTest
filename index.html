<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動線上預約系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <header>
    <h1>2026 活動體驗預約</h1>
    <p>請填寫資料完成線上報名</p>
  </header>

  <div class="content-box">
    <!-- 預約表單 -->
    <form id="bookingForm">
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" required placeholder="請輸入您的姓名">
      </div>
      
      <!-- 新增：服務學校/單位 -->
      <div class="form-group">
        <label for="unit">服務學校/單位</label>
        <input type="text" id="unit" required placeholder="請輸入您的學校或單位名稱">
      </div>

      <div class="form-group">
        <label for="phone">手機號碼</label>
        <input type="tel" id="phone" required placeholder="請輸入手機號碼">
      </div>
      <div class="form-group">
        <label for="timeslot">預約時段</label>
        <select id="timeslot" required>
          <option value="">-- 正在載入名額資訊... --</option>
        </select>
      </div>
      <button type="submit" id="submitBtn">立即預約</button>
    </form>

    <!-- 預約成功憑證 -->
    <div id="ticketCard" class="ticket-card">
      <h2>✓ 預約完成</h2>
      <p class="subtitle">請截圖儲存此畫面，現場出示憑證入場</p>
      <div class="ticket-info">
        <p><span>預約編號</span><span id="ticketId" class="value-highlight"></span></p>
        <p><span>姓名</span><span id="displayName" class="value"></span></p>
        <p><span>服務單位</span><span id="displayUnit" class="value"></span></p>
        <p><span>時段</span><span id="displayTime" class="value"></span></p>
      </div>
    </div>

    <!-- 查詢專區 -->
    <details>
      <summary><span>🎟️ 查詢預約記錄</span><span>›</span></summary>
      <div style="margin-top: 16px;">
        <div class="form-group">
          <input type="tel" id="searchPhone" placeholder="請輸入報名時的手機號碼">
        </div>
        <button type="button" id="searchBtn" onclick="searchBooking()" style="background: linear-gradient(135deg, #64748b 0%, #475569 100%); box-shadow: 0 4px 12px rgba(71, 85, 105, 0.2);">查詢預約記錄</button>

        <!-- 查詢結果顯示區域 -->
        <div id="searchResult" style="margin-top: 16px; font-size: 14px;"></div>
      </div>
    </details>
  </div>

  <footer>主辦單位：您的單位名稱</footer>
</main>

<script>
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbx2WjqS6uUtBlIGVG219uDOLeSknu-e-y45lsJtaVuRAEef30ZuOjLIkZ6K4C-c-vsb5Q/exec';

  // 頁面載入完成後自動查詢名額
  document.addEventListener('DOMContentLoaded', function() {
    loadTimeslotQuota();
  });

  function loadTimeslotQuota() {
    const selectEl = document.getElementById('timeslot');

    fetch(GAS_API_URL)
      .then(response => response.json())
      .then(res => {
        if (res.result === 'success') {
          selectEl.innerHTML = '<option value="">-- 請選擇預約時段 --</option>';

          res.data.forEach(item => {
            const option = document.createElement('option');
            option.value = item.timeslot;

            if (item.isFull) {
              option.textContent = `${item.timeslot} (已額滿)`;
              option.disabled = true;
            } else {
              option.textContent = `${item.timeslot} (剩餘 ${item.remaining} 名)`;
            }

            selectEl.appendChild(option);
          });
        } else {
          selectEl.innerHTML = '<option value="">-- 載入時段失敗，請重新整理 --</option>';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        selectEl.innerHTML = '<option value="">-- 網路連線錯誤 --</option>';
      });
  }

  // 處理表單提交 POST 邏輯
  document.getElementById('bookingForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = '處理中...';
    submitBtn.disabled = true;

    const name = document.getElementById('name').value;
    const unit = document.getElementById('unit').value; // 讀取服務單位
    const phone = document.getElementById('phone').value;
    const timeslot = document.getElementById('timeslot').value;

    const payload = {
      name: name,
      unit: unit,
      phone: phone,
      timeslot: timeslot
    };

    fetch(GAS_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'text/plain;charset=utf-8'
      },
      body: JSON.stringify(payload)
    })
    .then(response => response.json())
    .then(data => {
      if (data.result === 'success') {
        document.getElementById('displayName').innerText = name;
        document.getElementById('displayUnit').innerText = unit;
        document.getElementById('displayTime').innerText = timeslot;
        document.getElementById('ticketId').innerText = data.ticketId; 

        document.getElementById('bookingForm').style.display = 'none';
        document.getElementById('ticketCard').style.display = 'block';

      } else if (data.result === 'full') {
        alert(data.message);
        loadTimeslotQuota();
        submitBtn.innerText = '立即預約';
        submitBtn.disabled = false;

      } else {
        alert('預約失敗：' + data.message);
        submitBtn.innerText = '立即預約';
        submitBtn.disabled = false;
      }
    })
    .catch(error => {
      console.error('Error:', error);
      alert('網路連線失敗，請重試！');
      submitBtn.innerText = '立即預約';
      submitBtn.disabled = false;
    });
  });

  // 查詢功能
  function searchBooking() {
    const phoneInput = document.getElementById('searchPhone').value.trim();
    const resultDiv = document.getElementById('searchResult');
    const searchBtn = document.getElementById('searchBtn');

    if (!phoneInput) {
      alert('請輸入手機號碼！');
      return;
    }

    searchBtn.innerText = '查詢中...';
    searchBtn.disabled = true;
    resultDiv.innerHTML = '';

    fetch(`${GAS_API_URL}?phone=${encodeURIComponent(phoneInput)}`)
      .then(response => response.json())
      .then(res => {
        searchBtn.innerText = '查詢預約記錄';
        searchBtn.disabled = false;

        if (res.result === 'success') {
          if (res.data.length === 0) {
            resultDiv.innerHTML = '<p style="color: #ef4444; text-align: center; font-weight: 500;">查無預約紀錄，請確認號碼是否正確。</p>';
          } else {
            let html = '<div style="background: #f8fafc; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0;">';
            html += '<p style="font-weight: 600; margin-bottom: 12px; color: #2563eb;">找到您的預約紀錄：</p>';
            
            res.data.forEach(item => {
              html += `
                <div style="padding: 10px 0; border-bottom: 1px dashed #cbd5e1;">
                  <p style="display:flex; justify-content:space-between;"><span style="color:#64748b;">編號</span><span style="font-weight:700; color:#2563eb;">${item.ticketId}</span></p>
                  <p style="display:flex; justify-content:space-between;"><span style="color:#64748b;">姓名</span><span style="font-weight:600;">${item.name}</span></p>
                  <p style="display:flex; justify-content:space-between;"><span style="color:#64748b;">單位</span><span style="font-weight:600;">${item.unit || '-'}</span></p>
                  <p style="display:flex; justify-content:space-between;"><span style="color:#64748b;">時段</span><span style="font-weight:600;">${item.timeslot}</span></p>
                </div>
              `;
            });
            
            html += '</div>';
            resultDiv.innerHTML = html;
          }
        } else {
          resultDiv.innerHTML = '<p style="color: #ef4444;">查詢失敗：' + res.message + '</p>';
        }
      })
      .catch(error => {
        console.error('Error:', error);
        searchBtn.innerText = '查詢預約記錄';
        searchBtn.disabled = false;
        resultDiv.innerHTML = '<p style="color: #ef4444;">網路連線錯誤，請重試。</p>';
      });
  }
</script>

</body>
</html>
