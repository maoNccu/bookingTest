<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>活動線上預約系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <header>
    <h1>2026 活動體驗預約</h1>
    <p>請填寫資料完成線上報名</p>
  </header>

  <div class="content-box">
    <!-- 預約表單 -->
    <form id="bookingForm">
      <div class="form-group">
        <label for="name">姓名</label>
        <input type="text" id="name" required placeholder="請輸入您的姓名">
      </div>
      
      <div class="form-group">
        <label for="unit">服務學校/單位</label>
        <input type="text" id="unit" required placeholder="請輸入您的學校或單位名稱">
      </div>

      <div class="form-group">
        <label for="phone">手機號碼</label>
        <input type="tel" id="phone" required placeholder="請輸入手機號碼">
      </div>

      <!-- 按鈕式時段選擇區 -->
      <div class="form-group">
        <label>選擇預約時段與主題</label>
        <input type="hidden" id="selectedTimeslot" name="timeslot" required>
        <input type="hidden" id="selectedTopic" name="topic">
        
        <div id="timeslotList" class="timeslot-container">
          <p class="status-msg">正在載入場次與名額資訊...</p>
        </div>
      </div>

      <button type="submit" id="submitBtn">立即預約</button>
    </form>

    <!-- 預約送出提示卡片 -->
    <div id="ticketCard" class="ticket-card" style="display: none;">
      <h2>✓ 預約請求已送出</h2>
      <p class="subtitle">系統已收到您的搶票請求！您可以透過下方手機號碼查詢最終結果。</p>
      <div class="ticket-info">
        <p><span>預約主題</span><span id="displayTopic" class="value-highlight"></span></p>
        <p><span>姓名</span><span id="displayName" class="value"></span></p>
        <p><span>服務單位</span><span id="displayUnit" class="value"></span></p>
        <p><span>時段</span><span id="displayTime" class="value"></span></p>
      </div>

      <button type="button" id="resetBtn" class="btn-secondary">
        返回預約畫面
      </button>
    </div>

    <!-- 查詢專區 -->
    <details class="search-details">
      <summary><span>🎟️ 查詢預約記錄與憑證</span><span>›</span></summary>
      <div class="search-box">
        <div class="form-group">
          <input type="tel" id="searchPhone" placeholder="請輸入報名時的手機號碼">
        </div>
        <button type="button" id="searchBtn">查詢預約記錄</button>

        <!-- 查詢結果顯示區域 -->
        <div id="searchResult"></div>
      </div>
    </details>
  </div>

  <footer>主辦單位：iGER 教育部提升大學通識教育計畫</footer>
</main>

<script>
  // 1. GAS API 網址（僅用於 GET 讀取時段資訊與查詢紀錄）
  const GAS_API_URL = 'https://script.google.com/macros/s/AKfycby2HAV-zOM714sG9VETVBwo62B3yaS8LoRLX06uTZ4oQ0jE7K_5FGs927PFzuSzxUSZjA/exec';

  // 2. Google 表單提交網址 (請填入您表單的 FORM_ID)
  const GOOGLE_FORM_ACTION_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSfqCyAKghwmtkAWLVrrG7c0XAME65j8kp7c8W1PVNsUobd2aw/formResponse';

  // 3. Google 表單對應各欄位的 entry ID (請替換為您表單實際的 entry.XXXXX)
  const FORM_ENTRIES = {
    name: 'entry.1479093023',
    unit: 'entry.2030731490',
    phone: 'entry.2102667824',
    timeslot: 'entry.781890633'
  };

  document.addEventListener('DOMContentLoaded', function() {
    loadTimeslots();
    document.getElementById('bookingForm').addEventListener('submit', handleBookingSubmit);
    document.getElementById('resetBtn').addEventListener('click', resetToBookingForm);
    document.getElementById('searchBtn').addEventListener('click', searchBooking);
  });

  /**
   * 1. 載入場次與名額資料
   */
  function loadTimeslots() {
  const listEl = document.getElementById('timeslotList');

  // 使用 URL 參數避開部分的快取與 CORS 阻擋
  fetch(`${GAS_API_URL}?t=${new Date().getTime()}`, {
    method: 'GET',
    redirect: 'follow'
  })
    .then(response => {
      if (!response.ok) {
        throw new Error(`HTTP 錯誤！狀態碼：${response.status}`);
      }
      return response.json();
    })
    .then(res => {
      if (res.result === 'success') {
        listEl.innerHTML = '';

        if (!res.data || res.data.length === 0) {
          listEl.innerHTML = '<p class="status-msg">目前無開放預約的時段。</p>';
          return;
        }

        res.data.forEach(item => {
          const card = document.createElement('div');
          const remainingNum = parseInt(item.remaining, 10);
          const isFull = (item.isFull === true || item.isFull === 'true' || remainingNum <= 0);

          card.className = `timeslot-card ${isFull ? 'disabled' : ''}`;
          card.innerHTML = `
            <span class="slot-time">⏰ ${item.timeslot || ''}</span>
            <span class="slot-topic">🎯 ${item.topic || '體驗活動'}</span>
            <div class="slot-badge">
              ${isFull ? '已額滿' : `剩 ${isNaN(remainingNum) ? item.remaining : remainingNum} 名`}
            </div>
          `;

          if (!isFull) {
            card.addEventListener('click', function(e) {
              e.preventDefault();
              document.querySelectorAll('.timeslot-card').forEach(c => c.classList.remove('selected'));
              card.classList.add('selected');

              document.getElementById('selectedTimeslot').value = item.timeslot;
              document.getElementById('selectedTopic').value = item.topic || '體驗活動';
            });
          }

          listEl.appendChild(card);
        });
      } else {
        listEl.innerHTML = `<p class="status-error">載入時段失敗：${res.message || ''}</p>`;
      }
    })
    .catch(error => {
      console.error('Fetch Error:', error);
      listEl.innerHTML = `<p class="status-error">網路連線錯誤（${error.message}），請確認 GAS 部署權限或重新整理。</p>`;
    });
}
  /**
   * 2. 透過 Google Form 發送大流量搶票請求
   */
  function handleBookingSubmit(e) {
    e.preventDefault();

    const selectedTimeslot = document.getElementById('selectedTimeslot').value;
    const selectedTopic = document.getElementById('selectedTopic').value;

    if (!selectedTimeslot) {
      alert('請先點擊選擇一個預約時段！');
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = '搶票送出中...';
    submitBtn.disabled = true;

    const name = document.getElementById('name').value;
    const unit = document.getElementById('unit').value;
    const phone = document.getElementById('phone').value;

    const formData = new FormData();
    formData.append(FORM_ENTRIES.name, name);
    formData.append(FORM_ENTRIES.unit, unit);
    formData.append(FORM_ENTRIES.phone, phone);
    formData.append(FORM_ENTRIES.timeslot, selectedTimeslot);

    fetch(GOOGLE_FORM_ACTION_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: formData
    })
    .then(() => {
      document.getElementById('displayName').innerText = name;
      document.getElementById('displayUnit').innerText = unit;
      document.getElementById('displayTime').innerText = selectedTimeslot;
      document.getElementById('displayTopic').innerText = selectedTopic || '體驗活動';

      document.getElementById('bookingForm').style.display = 'none';
      document.getElementById('ticketCard').style.display = 'block';
    })
    .catch(error => {
      console.error('Error:', error);
      alert('網路連線失敗，請稍後重試！');
      submitBtn.innerText = '立即預約';
      submitBtn.disabled = false;
    });
  }

  /**
   * 3. 重置表單畫面
   */
  function resetToBookingForm() {
    document.getElementById('bookingForm').reset();
    document.getElementById('selectedTimeslot').value = '';
    document.getElementById('selectedTopic').value = '';

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.innerText = '立即預約';
    submitBtn.disabled = false;

    document.getElementById('ticketCard').style.display = 'none';
    document.getElementById('bookingForm').style.display = 'block';

    loadTimeslots();
  }

  /**
   * 4. 查詢預約紀錄與憑證編號
   */
  function searchBooking() {
    const phoneInput = document.getElementById('searchPhone').value.trim();
    const resultDiv = document.getElementById('searchResult');
    const searchBtn = document.getElementById('searchBtn');

    if (!phoneInput) {
      alert('請輸入手機號碼！');
      return;
    }

    searchBtn.innerText = '查詢中...';
    searchBtn.disabled = true;
    resultDiv.innerHTML = '';

    fetch(`${GAS_API_URL}?phone=${encodeURIComponent(phoneInput)}`)
      .then(response => response.json())
      .then(res => {
        searchBtn.innerText = '查詢預約記錄';
        searchBtn.disabled = false;

        if (res.result === 'success') {
          if (!res.data || res.data.length === 0) {
            resultDiv.innerHTML = '<p class="status-error">查無預約紀錄，或資料處理中，請稍後重試。</p>';
          } else {
            let html = '<div class="result-card">';
            html += '<p class="result-title">您的預約紀錄與結果：</p>';
            
            res.data.forEach(item => {
              let statusBadge = '';
              if (item.status === '成功') {
                statusBadge = '<span class="badge-status success">預約成功</span>';
              } else if (item.status === '額滿失敗') {
                statusBadge = '<span class="badge-status failed">殘念額滿</span>';
              } else {
                statusBadge = '<span class="badge-status pending">系統處理中</span>';
              }

              html += `
                <div class="result-item">
                  <p><span>預約狀態</span>${statusBadge}</p>
                  <p><span>憑證編號</span><span class="value">${item.ticketId}</span></p>
                  <p><span>預約主題</span><span class="value">${item.topic || '體驗活動'}</span></p>
                  <p><span>預約時段</span><span>${item.timeslot}</span></p>
                  <p><span>姓名</span><span>${item.name}</span></p>
                </div>
              `;
            });
            
            html += '</div>';
            resultDiv.innerHTML = html;
          }
        } else {
          resultDiv.innerHTML = `<p class="status-error">查詢失敗：${res.message || ''}</p>`;
        }
      })
      .catch(error => {
        console.error('Error:', error);
        searchBtn.innerText = '查詢預約記錄';
        searchBtn.disabled = false;
        resultDiv.innerHTML = '<p class="status-error">網路連線錯誤，請重試。</p>';
      });
  }
</script>

</body>
</html>
